[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "email-agent-send-gate"
version = "0.1.0"
description = "A send gate for AI email agents: the agent drafts, the gate decides."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dkimpy>=1.1",
    "dnspython>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
ses = ["boto3>=1.34"]
claude = ["anthropic>=2.3"]
mailtester = ["mcp>=2"]
dev = [
    "pytest>=8",
    "aiosmtpd>=1.4",
    "pyyaml>=6",
    "ruff>=0.6",
]

[project.scripts]
gate = "gate.cli:main"
prospect = "prospecting.cli:main"
agent = "agent.cli:main"

[project.urls]
Homepage = "https://github.com/postboxservices/email-agent-send-gate"

[tool.setuptools.packages.find]
include = ["gate*", "unsubscribe*", "inbound*", "prospecting*", "agent*", "db*"]

[tool.setuptools.package-data]
db = ["migrations/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
